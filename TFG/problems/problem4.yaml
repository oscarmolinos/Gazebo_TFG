  - [vp4, vp2]
  - [vp2, vp3]
  - [vp3, vp1]
  - [vp4, vp1]

  - [vp8, vp5]
  - [vp5, vp7]
  - [vp7, vp6]
  - [vp6, vp8]

  - [vp9, vp11]
  - [vp11, vp10]
  - [vp10, vp12]
  - [vp12, vp9]

  - [vp7, vp4]
  - [vp2, vp9]
  - [vp11, vp3]

# Desde que viewpoint se puede fotografiar cada target.
CAN_PHOTOGRAPH:
  vp1: tgt1
  vp2: tgt2
  vp3: tgt3
  vp4: tgt4
  vp5: tgt5
  vp6: tgt6
  vp7: tgt7
  vp8: tgt8
  vp9: tgt9
  vp10: tgt10
  vp11: tgt11
  vp12: tgt12

# Posicion inicial, bateria, velocidad y base objetivo final de cada dron.
DRONES:
  drone1: {start: base1_ground, battery_level: 100.0, battery_capacity: 100.0, speed: 1.0, goal: base1_ground}
  drone2: {start: base2_ground, battery_level: 100.0, battery_capacity: 100.0, speed: 1.0, goal: base2_ground}
  drone3: {start: base3_ground, battery_level: 100.0, battery_capacity: 100.0, speed: 1.0, goal: base3_ground}
  drone4: {start: base4_ground, battery_level: 100.0, battery_capacity: 100.0, speed: 1.0, goal: base4_ground}

# Simula el fallo de un dron en un instante de tiempo
FAILURES:
  - {drone: drone1, at_time: 20.0}
  - {drone: drone3, at_time: 40.0}