  - [wp1, wp4]

  - [wp1, vp6]
  - [wp1, vp7]
  - [wp1, vp4]
  - [wp1, vp2]
  - [wp1, vp9]
  - [wp1, vp12]

  - [wp2, vp1]
  - [wp2, vp2]
  - [wp2, vp3]
  - [wp2, vp4]
  - [wp3, vp5]
